{% extends 'base.html' %}
{% block title %}Reset Password - DigipandaCRM{% endblock %}

{% block content %}
<div style="min-height: 82vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;">
  <div class="tp-login-card" style="width: 100%; max-width: 440px; padding: 36px 32px;">
    <!-- Animation A — Welcome heading (300ms, delay 0ms) -->
    <div class="tp-login-anim-heading" style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, rgba(79, 70, 229, 0.12) 0%, rgba(99, 102, 241, 0.2) 100%); color: var(--tp-primary-600, #4f46e5); margin-bottom: 14px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1 style="font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; color: var(--tp-text-primary, #0f172a); margin: 0 0 6px 0;">Reset Password</h1>
      <p style="color: var(--tp-text-muted, #64748b); font-size: 0.88rem; margin: 0;">Enter your registered email and we'll send a secure reset link.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <!-- Animation B — Email field (300ms, delay 180ms) -->
      <div class="form-group tp-login-anim-field-1" style="margin-bottom: 20px;">
        <label class="form-label" for="id_email" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 7px; color: var(--tp-text-primary, #0f172a);">
          Email Address
        </label>
        <input type="email" id="id_email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
      </div>

      <!-- Animation D — Submit button (280ms, delay 330ms) -->
      <button type="submit" class="btn btn-primary tp-login-anim-btn" style="width: 100%; padding: 11px; font-size: 0.92rem; font-weight: 700; letter-spacing: 0.01em;">
        Send Password Reset Instructions
      </button>
    </form>

    <div class="tp-login-anim-meta" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--tp-surface-border-subtle, #e2e8f0); text-align: center; font-size: 0.825rem;">
      <a href="{% url 'login' %}" style="color: var(--tp-primary-600, #4f46e5); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
